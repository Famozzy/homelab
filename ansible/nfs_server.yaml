---
- name: NFS Server Setup
  hosts: nfs-server
  become: true
  vars:
    nfs_clients:
      - "k3s-worker1"
      - "k3s-worker2"
    nfs_exports:
      - data
      - monitoring
  tasks:
    - name: Install NFS server packages
      apt:
        name:
          - nfs-kernel-server
          - nfs-common
        state: present
    - name: Enable NFS server
      service:
        name: nfs-kernel-server
        state: started
        enabled: true      
    - name: Create NFS export directory
      file:
        path: "/srv/nfs/{{ item }}"
        state: directory
        owner: nobody
        group: nogroup
        mode: "0777"
      with_items: "{{ nfs_exports }}"
    - name: Configure NFS exports
      copy:
        dest: /etc/exports
        content: |
          {% for client in nfs_clients %}
          {% for export in nfs_exports %}
          /srv/nfs/{{ export }} {{ client }}(rw,sync,no_subtree_check,no_root_squash)
          {% endfor %}
          {% endfor %}
    - name: Apply NFS export configuration
      command: exportfs -rav
      changed_when: false
      
- name: Install NFS client packages on k3s workers
  hosts: k3s_workers
  become: true
  tasks:
    - name: Install NFS client package
      apt:
        name: nfs-common
        state: present
