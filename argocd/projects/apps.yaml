---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
  sourceRepos:
    - https://github.com/Famozzy/homelab.git
  clusterResourceWhitelist:
  - group: "*"
    kind: "*"
  namespaceResourceWhitelist:
  - group: "*"
    kind: "*"