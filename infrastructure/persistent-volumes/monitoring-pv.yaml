---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: monitoring-pv
  namespace: monitoring
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=4.1
    - hard
    - tcp
    - noatime
    - nodiratime
  nfs:
    path: /srv/nfs/monitoring
    server: nfs-server
