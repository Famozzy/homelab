---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bento-pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bento-pdf
  template:
    metadata:
      labels:
        app: bento-pdf
    spec:
      containers:
        - name: bento-pdf
          image: ghcr.io/alam00000/bentopdf-simple:2.8.11
          resources:
            requests:
              memory: "50Mi"
              cpu: "50m"
            limits:
              memory: "100Mi"
              cpu: "100m"
          ports:
            - containerPort: 8080
