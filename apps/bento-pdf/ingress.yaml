---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bento-pdf
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-issuer
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - bento-pdf.famozzy.dev
      secretName: bento-pdf-tls
  rules:
    - host: bento-pdf.famozzy.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bento-pdf
                port:
                  number: 8080
